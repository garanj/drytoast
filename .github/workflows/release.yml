name: Release Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      create_github_release:
        description: 'Create/update GitHub Release for this tag'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build Signed APK / AAB & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve Version Metadata
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_TAG="${{ inputs.version }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$RAW_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version tag '$RAW_TAG'. Expected format vMAJOR.MINOR.PATCH (e.g. v0.1.0)."
            exit 1
          fi

          VERSION_NAME="${RAW_TAG#v}"
          TAG_NAME="v${VERSION_NAME}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))
          if [[ "$VERSION_CODE" -lt 1 ]]; then
            VERSION_CODE=1
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved release: tag=${TAG_NAME}, versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}"

      - name: Decode Signing Keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$SIGNING_KEYSTORE_BASE64" ]]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/threshold-release.jks"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
            echo "keystore_path=${KEYSTORE_FILE}" >> "$GITHUB_OUTPUT"
            echo "signed_with_release_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set; falling back to debug signing config."
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            echo "signed_with_release_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Spotless & Host JVM Unit Tests
        run: ./gradlew spotlessCheck test

      - name: Assemble Signed Release APK & App Bundle (AAB)
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SIGNING_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Prepare Release Artifacts & Compute 6-Tap QR Checksum
        id: artifacts
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p release-dist
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="app/build/outputs/bundle/release/app-release.aab"
          MAPPING_SRC="app/build/outputs/mapping/release/mapping.txt"

          cp "$APK_SRC" "release-dist/threshold-release.apk"
          cp "$APK_SRC" "release-dist/threshold-v${VERSION_NAME}.apk"
          cp "$AAB_SRC" "release-dist/threshold-v${VERSION_NAME}.aab"
          if [[ -f "$MAPPING_SRC" ]]; then
            cp "$MAPPING_SRC" "release-dist/mapping-v${VERSION_NAME}.txt"
          fi

          SHA256_HEX=$(sha256sum "release-dist/threshold-release.apk" | awk '{print $1}')
          # Android ManagedProvisioning requires URL-safe Base64 (no '=' padding) of the raw SHA-256 digest
          QR_CHECKSUM=$(openssl dgst -sha256 -binary "release-dist/threshold-release.apk" | openssl base64 | tr '+/' '-_' | tr -d '=\n')
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/threshold-release.apk"

          cat <<EOF > release-dist/provisioning-qr-payload.json
          {
            "android.app.extra.PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME": "com.garan.threshold/.dpc.ThresholdDeviceAdminReceiver",
            "android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_DOWNLOAD_LOCATION": "${DOWNLOAD_URL}",
            "android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_CHECKSUM": "${QR_CHECKSUM}"
          }
          EOF
          sed -i 's/^          //' release-dist/provisioning-qr-payload.json

          cp "release-dist/provisioning-qr-payload.json" "site/provisioning-qr-payload.json"

          cat <<EOF > release-dist/RELEASE_NOTES.md
          ## Threshold ${TAG_NAME} (\`versionCode ${VERSION_CODE}\`)

          ### Artifacts
          - **\`threshold-release.apk\` / \`threshold-v${VERSION_NAME}.apk\`**: Signed universal Android APK (for direct installation & 6-tap QR provisioning)
          - **\`threshold-v${VERSION_NAME}.aab\`**: Signed Android App Bundle (for Google Play Console upload)
          - **\`mapping-v${VERSION_NAME}.txt\`**: R8 obfuscation mapping file

          ### Checksums (\`threshold-release.apk\`)
          - **SHA-256 (Hex):** \`${SHA256_HEX}\`
          - **Android 6-Tap QR Checksum (URL-Safe Base64 SHA-256):** \`${QR_CHECKSUM}\`

          ### 6-Tap Welcome Screen QR Provisioning Payload
          Encode the following JSON into the Hardened Mode Setup QR code on the Threshold website:
          \`\`\`json
          $(cat release-dist/provisioning-qr-payload.json)
          \`\`\`
          EOF
          sed -i 's/^          //' release-dist/RELEASE_NOTES.md

          cat release-dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release Artifacts to Workflow Run
        uses: actions/upload-artifact@v7
        with:
          name: threshold-release-${{ steps.version.outputs.tag_name }}
          path: release-dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              release-dist/threshold-release.apk \
              release-dist/threshold-v*.apk \
              release-dist/threshold-v*.aab \
              release-dist/mapping-v*.txt \
              release-dist/provisioning-qr-payload.json \
              --clobber
            gh release edit "$TAG_NAME" --notes-file release-dist/RELEASE_NOTES.md
          else
            gh release create "$TAG_NAME" \
              release-dist/threshold-release.apk \
              release-dist/threshold-v*.apk \
              release-dist/threshold-v*.aab \
              release-dist/mapping-v*.txt \
              release-dist/provisioning-qr-payload.json \
              --title "Threshold ${TAG_NAME}" \
              --notes-file release-dist/RELEASE_NOTES.md
          fi

      - name: Deploy APK & Provisioning QR Payload to Firebase Hosting
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release == true)) && env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: thresholdlauncher

      - name: Clean Up Keystore File
        if: always()
        run: rm -f "${RUNNER_TEMP}/threshold-release.jks"
